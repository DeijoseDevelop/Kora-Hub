name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install sqlc
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz"
          tar -xzf /tmp/sqlc.tar.gz -C /tmp sqlc
          sudo mv /tmp/sqlc /usr/local/bin/
          sqlc version

      - name: Frontend deps
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Frontend tests + build
        working-directory: web
        run: |
          npx vitest run
          npm run build

      - name: Embed frontend + Go vet
        run: |
          rm -rf internal/web/dist && cp -r web/dist internal/web/dist
          go vet ./...

      - name: sqlc generate (diff check)
        run: |
          sqlc generate
          git diff --exit-code -- internal/db || (echo "código sqlc desactualizado" && exit 1)

      - name: Go tests
        run: go test ./...

  # Load test k6 sobre el binario real + verificación del presupuesto P5
  # (<100 MB RAM): tras el pico se lee VmHWM (pico RSS) del proceso.
  loadtest:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend deps + build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binary
        run: |
          rm -rf internal/web/dist && cp -r web/dist internal/web/dist
          go build -o bin/kora-hub ./cmd/hub

      - name: Start server
        run: |
          mkdir -p /tmp/kora-data
          HUB_BIND=127.0.0.1:8099 HUB_DATA_DIR=/tmp/kora-data \
            HUB_JWT_SECRET=ci-loadtest-secret bin/kora-hub &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/healthz && exit 0
            sleep 1
          done
          echo "el servidor no arranco" && exit 1

      - uses: grafana/setup-k6-action@v1

      - name: k6 run
        run: k6 run scripts/loadtest.js
        env:
          BASE_URL: http://127.0.0.1:8099

      - name: Memory budget check (<100 MB)
        run: |
          PID=$(pgrep -x kora-hub | head -1)
          HWM_KB=$(awk '/VmHWM/ {print $2}' /proc/"$PID"/status)
          echo "pico RSS: ${HWM_KB} KB"
          if [ "$HWM_KB" -gt 102400 ]; then
            echo "::error::presupuesto de RAM superado: ${HWM_KB} KB > 102400 KB"
            exit 1
          fi
          kill "$PID" || true

  # E2E Playwright sobre el binario real — escenario crítico (AGENTS):
  # register → doc con tarea → kanban → cola offline con replay →
  # share-link público sin sesión.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend deps + build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build binary
        run: |
          rm -rf internal/web/dist && cp -r web/dist internal/web/dist
          go build -o bin/kora-hub ./cmd/hub

      - name: Start server
        run: |
          mkdir -p /tmp/kora-data-e2e
          HUB_BIND=127.0.0.1:8099 HUB_DATA_DIR=/tmp/kora-data-e2e \
            HUB_JWT_SECRET=ci-e2e-secret bin/kora-hub &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/healthz && exit 0
            sleep 1
          done
          echo "el servidor no arranco" && exit 1

      - name: E2E deps
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:8099

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install sqlc
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz"
          tar -xzf /tmp/sqlc.tar.gz -C /tmp sqlc
          sudo mv /tmp/sqlc /usr/local/bin/
          sqlc version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.17.1

      - name: GoReleaser
        run: |
          set +e
          goreleaser release --clean > /tmp/goreleaser.log 2>&1
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            tail -60 /tmp/goreleaser.log
            python3 -c "import sys;[print('::error::'+l.replace('%','%25').replace(chr(10),'%0A').replace(chr(13),'%0D')) for l in open('/tmp/goreleaser.log').read().splitlines()[-40:]]"
          fi
          exit $EXIT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
